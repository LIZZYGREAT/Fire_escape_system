<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>火灾动态逃生推演系统</title>
    <style>
        body {
            background-color: #f0f2f5; /* 外部浅灰色背景 */
            color: #333;
            margin: 0;
            display: flex;
            /* 修改点：允许页面纵向滚动，并设置最小高度 */
            min-height: 100vh; 
            overflow-y: auto; 
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        /* 左侧：物理推演画布区 */
        #sim-area {
            flex: 1;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            background-color: #e4e7eb;
            border-right: 1px solid #ccc;
            padding: 40px 0; /* 增加上下留白，方便滚动查看 */
        }

        #canvas-container {
            position: relative; 
            /* 保持画布比例，可根据需要调整大小 */
            height: 85vh; 
            width: 85vh;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            background-color: #ffffff; 
            border-radius: 4px;
        }

        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 4px;
        }

        /* 右侧：推演控制台 Dashboard */
        #dashboard {
            width: 320px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            
            /* 修改点：设置粘性定位，让控制面板跟随滚动不消失 */
            position: sticky;
            top: 0;
            height: 100vh; 
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a1a1a;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .legend-group {
            margin-bottom: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #444;
        }

        .indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 12px;
        }

        /* 状态颜色定义 */
        .ind-safe { background: #2ecc71; box-shadow: 0 2px 6px rgba(46, 204, 113, 0.4); }
        .ind-smoke { background: #9b59b6; box-shadow: 0 2px 6px rgba(155, 89, 182, 0.4); }
        .ind-trap { background: #f1c40f; box-shadow: 0 2px 6px rgba(241, 196, 15, 0.4); }
        .ind-fire { background: #e74c3c; box-shadow: 0 2px 6px rgba(231, 76, 60, 0.4); }

        .line-indicator {
            width: 25px;
            height: 4px;
            margin-right: 10px;
            border-radius: 2px;
        }
        .line-solid { background: #27ae60; }
        .line-dashed { border-bottom: 3px dashed #f1c40f; }

        /* 控制按钮 */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        button {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #f8f9fa;
            border-color: #bbb;
        }

        button.active-btn {
            background-color: #27ae60;
            color: #fff;
            border-color: #219150;
        }
        
        /* 网络状态 */
        #net-status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            font-size: 0.8rem;
            color: #999;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #e74c3c;
        }

        .status-dot.online {
            background: #2ecc71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.6);
        }

        /* 美化滚动条 (滑块) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

    </style>
</head>
<body>
    <div id="sim-area">
        <div id="canvas-container"></div>
    </div>

    <div id="dashboard">
        <div class="panel-title">System Dashboard</div>
        
        <div class="legend-group">
            <div style="color:#888; margin-bottom:12px; font-size:0.75rem; font-weight:bold; text-transform:uppercase;">节点物理状态</div>
            <div class="legend-item"><div class="indicator ind-safe"></div> 正常/安全区域</div>
            <div class="legend-item"><div class="indicator ind-smoke"></div> 烟雾覆盖区域</div>
            <div class="legend-item"><div class="indicator ind-trap"></div> 黄色：被困区域</div>
            <div class="legend-item"><div class="indicator ind-fire"></div> 红色：火灾核心区</div>
        </div>

        <div class="legend-group">
            <div style="color:#888; margin-bottom:12px; font-size:0.75rem; font-weight:bold; text-transform:uppercase;">逃生路径指引</div>
            <div class="legend-item"><div class="line-indicator line-solid"></div> 动态安全逃生路线</div>
            <div class="legend-item"><div class="line-indicator line-dashed"></div> 逆向救援引导线</div>
        </div>

        <div class="control-group">
            <button id="btn-toggle">PAUSE 暂停演化</button>
            <button id="btn-reset">RESET 重置物理沙盒</button>
        </div>

        <div id="net-status">
            <div id="status-light" class="status-dot"></div>
            <span id="status-text">DISCONNECTED</span>
        </div>
    </div>
    
    <script type="module" src="./js/main.js"></script>
</body>
</html>
